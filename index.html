<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cat Sitting — Connexion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8896A">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app login-wrap">

  <div class="login-hero">
    <div class="paw" id="pawTrigger" style="cursor:pointer;">🐾</div>
    <h1>Cat Sitting</h1>
    <p>Gérez vos gardes en toute simplicité</p>
  </div>

  <!-- Vue : connexion -->
  <div id="viewLogin">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="ton@email.com" autocomplete="username">
    <label>Mot de passe</label>
    <input type="password" id="loginPassword" placeholder="Ton mot de passe" autocomplete="current-password">
    <div class="field-hint" id="loginError" style="color:var(--red); display:none;"></div>
    <button class="btn btn-primary mt-16" id="confirmLogin">Se connecter</button>
    <p class="small text-lt mt-16" style="text-align:center;">
      Pas encore de compte ? <a href="#" id="goToSignup">Créer un compte</a>
    </p>
  </div>

  <!-- Vue : inscription -->
  <div id="viewSignup" style="display:none;">
    <label>Prénom</label>
    <input type="text" id="newName" placeholder="Ex : Aurélia" autocomplete="name">
    <label>Email</label>
    <input type="email" id="newEmail" placeholder="ton@email.com" autocomplete="username">
    <label>Mot de passe</label>
    <input type="password" id="newPassword" placeholder="Choisis un mot de passe (6 caractères min.)" autocomplete="new-password">
    <div class="field-hint" id="signupError" style="color:var(--red); display:none;"></div>
    <button class="btn btn-primary mt-16" id="confirmSignup">Créer mon compte</button>
    <p class="small text-lt mt-16" style="text-align:center;">
      Déjà un compte ? <a href="#" id="goToLogin">Se connecter</a>
    </p>
  </div>

</div>

<!-- Modal : accès admin (code secret) -->
<div class="modal-overlay" id="modalAdminCode">
  <div class="modal">
    <div class="modal-head">
      <h3>Accès admin</h3>
      <button class="modal-close" data-close="modalAdminCode">✕</button>
    </div>
    <label>Code secret</label>
    <input type="text" id="adminCodeInput" inputmode="numeric" maxlength="4" placeholder="••••">
    <div class="field-hint" id="adminCodeError" style="color:var(--red); display:none;">Code incorrect.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close="modalAdminCode">Annuler</button>
      <button class="btn btn-primary" id="confirmAdminCode">Valider</button>
    </div>
  </div>
</div>

<script src="storage.js"></script>
<script type="module" src="login.js"></script>
</body>
</html>
