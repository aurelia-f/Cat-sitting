<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cat Sitting — Itinéraire du jour</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8896A">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  #map { width: 100%; height: 42vh; border-radius: var(--radius-m); border: 1px solid var(--border); margin-bottom: 14px; }
  .stop-num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: #fff; font-weight: bold; font-size: 13px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .reorder-btns { display: flex; flex-direction: column; gap: 2px; }
  .reorder-btns .icon-action { width: 26px; height: 22px; font-size: 11px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="back-btn" id="backBtn">←</div>
    <h1>🧭 Itinéraire</h1>
    <div class="icon-btn" id="prefsBtn" title="Préférences">⚙️</div>
  </div>

  <label>Jour</label>
  <input type="date" id="dayInput">

  <div id="status" class="empty-state mt-16">Choisis un jour pour voir l'itinéraire.</div>

  <div id="results" style="display:none;">
    <div id="map"></div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="val" id="statStops">0</div>
        <div class="lbl">Arrêts</div>
      </div>
      <div class="stat-box">
        <div class="val" id="statDuration">0 min</div>
        <div class="lbl">Trajet total</div>
      </div>
      <div class="stat-box">
        <div class="val" id="statDistance">0 km</div>
        <div class="lbl">Distance</div>
      </div>
    </div>

    <div id="stopsList"></div>
  </div>

  <div id="unlocatedSection" class="mt-16" style="display:none;">
    <div class="section-head"><h2 class="small text-lt">⚠️ Adresses non localisées (non incluses dans l'itinéraire)</h2></div>
    <div id="unlocatedList"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="storage.js"></script>
<script type="module" src="cloudsync.js"></script>
<script type="module" src="itineraire.js"></script>
</body>
</html>
