<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cat Sitting — Message</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <button class="header-back" onclick="goTo('accueil.html')">←</button>
  <div style="flex:1">
    <h1 id="msg-title">Message</h1>
    <p style="color:rgba(255,255,255,0.8);font-size:12px">Ce qui change aujourd'hui</p>
  </div>
</div>

<div class="container">

  <!-- Badge animal -->
  <div class="card card-accent" id="animal-badge" style="display:flex;gap:10px;align-items:center;margin-bottom:14px"></div>

  <!-- Type de message -->
  <div class="card">
    <div class="section-label">📩 Type de message</div>
    <div class="pills" id="msg-type-pills">
      <button class="pill" onclick="setQ('message_type','premier');this.closest('.pills').querySelectorAll('.pill').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">1er msg</button>
      <button class="pill" onclick="setQ('message_type','suivi');this.closest('.pills').querySelectorAll('.pill').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">Suivi</button>
      <button class="pill" onclick="setQ('message_type','dernier');this.closest('.pills').querySelectorAll('.pill').forEach(b=>b.classList.remove('selected'));this.classList.add('selected');document.getElementById('keys-section').classList.remove('hidden')">Dernier</button>
    </div>
  </div>

  <!-- Repas -->
  <div class="card">
    <div class="section-label">🍽️ Il/elle a mangé ?</div>
    <div class="pills">
      <button class="pill" onclick="setQPill(this,'ate_well','Très bien')">😋 Très bien</button>
      <button class="pill" onclick="setQPill(this,'ate_well','Normal')">😊 Normal</button>
      <button class="pill" onclick="setQPill(this,'ate_well','Peu')">😐 Peu</button>
    </div>
  </div>

  <!-- Activité -->
  <div class="card">
    <div class="section-label">✨ Activité du jour</div>
    <div class="tags" id="activity-tags">
      <button class="tag-btn" onclick="toggleQ(this,'today_activity','Ronronné fort')">Ronronné fort</button>
      <button class="tag-btn" onclick="toggleQ(this,'today_activity','Dormi dans mes bras')">Dormi dans mes bras</button>
      <button class="tag-btn" onclick="toggleQ(this,'today_activity','Joué')">Joué</button>
      <button class="tag-btn" onclick="toggleQ(this,'today_activity','Fait des bisous')">Fait des bisous</button>
      <button class="tag-btn" onclick="toggleQ(this,'today_activity','Exploré')">Exploré</button>
    </div>
  </div>

  <!-- Entretien -->
  <div class="card hidden" id="entretien-section">
    <div class="section-label">🧹 Entretien</div>
    <div id="entretien-checks"></div>
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
      <label class="chk-label">
        <div class="chk-box" id="chk-include" onclick="toggleInclude()"></div>
        Inclure dans le message
      </label>
    </div>
  </div>

  <!-- Incident -->
  <div class="card">
    <div class="section-label">⚠️ Incident ? (optionnel)</div>
    <div class="options" id="incident-opts">
      <button class="option" onclick="setIncident(this,'Petite boulette')">Petite boulette</button>
      <button class="option" onclick="setIncident(this,'A vomi')">A vomi</button>
      <button class="option" onclick="setIncident(this,'Semble fatigué(e)')">Semble fatigué(e)</button>
      <button class="option" onclick="setIncident(this,'A peu mangé')">A peu mangé</button>
      <button class="option" onclick="setIncident(this,'Autre')">Autre</button>
    </div>
    <input type="text" id="incident-text" placeholder="Précise si besoin..." style="margin-top:8px" oninput="qForm.incident=this.value">
  </div>

  <!-- Anecdote -->
  <div class="card">
    <div class="section-label">💬 Petite anecdote</div>
    <p style="font-size:12px;color:var(--text-lt);margin-bottom:8px">Écris ce qui s'est passé, je le reformule 😊</p>
    <input type="text" id="anecdote-input" placeholder="Ex: il s'est endormi sur mes pieds..." oninput="qForm.anecdote=this.value">
  </div>

  <!-- Rendu des clés (dernier message) -->
  <div class="card hidden" id="keys-section">
    <div class="section-label">🔑 Rendu des clés</div>
    <div class="options">
      <button class="option" onclick="setQOpt(this,'keys_return','boite')">Dans la boîte aux lettres</button>
      <button class="option" onclick="setQOpt(this,'keys_return','claque')">Laissé dans la maison (porte claquée)</button>
      <button class="option" onclick="setQOpt(this,'keys_return','rdv')">Rendez-vous prévu</button>
    </div>
  </div>

  <button class="btn btn-primary" id="gen-btn" onclick="generateMsg()" style="display:flex;align-items:center;justify-content:center;gap:10px">
    🐾 Générer le message
  </button>

  <!-- Résultat -->
  <div class="hidden" id="result-section">
    <div class="card" style="margin-top:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="color:var(--accent)">🐾</span>
        <span style="font-weight:bold;color:var(--accent);font-size:14px">Message pour le client</span>
      </div>
      <div class="message-box" id="result-message"></div>
    </div>

    <div id="info-client"></div>

    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-primary" id="copy-btn" onclick="copyMsg()">📋 Copier</button>
      <button class="btn btn-outline" onclick="goTo('accueil.html')">🔄 Accueil</button>
    </div>
  </div>

</div>

<script src="storage.js"></script>
<script src="message.js"></script>
</body>
</html>
