<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cat Sitting — Calendrier</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8896A">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="back-btn" id="backBtn">←</div>
    <h1>📅 Calendrier</h1>
  </div>

  <div class="cal-head">
    <div class="icon-btn" id="prevMonth">‹</div>
    <div class="month-label" id="monthLabel"></div>
    <div class="icon-btn" id="nextMonth">›</div>
  </div>

  <div class="cal-grid" id="calDow"></div>
  <div class="cal-grid mt-8" id="calGrid"></div>

  <div class="mt-16 small text-lt">
    🐾 Garde &nbsp; ⏰ Visite planifiée &nbsp; 🔑 RDV clés — la couleur indique le chat
  </div>
  <div class="mt-8" id="animalLegend" style="display:flex; flex-wrap:wrap; gap:6px 12px;"></div>

  <div class="section mt-16">
    <div class="section-head"><h2 id="dayDetailTitle">Sélectionnez un jour</h2></div>
    <div id="dayDetail"></div>
  </div>

</div>

<!-- Modal : planifier une visite -->
<div class="modal-overlay" id="modalVisite">
  <div class="modal">
    <div class="modal-head">
      <h3>Planifier une visite</h3>
      <button class="modal-close" data-close="modalVisite">✕</button>
    </div>
    <label>Animal</label>
    <select id="visiteAnimalSelect"></select>
    <label>Heure de la visite</label>
    <input type="time" id="visiteTime">
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close="modalVisite">Annuler</button>
      <button class="btn btn-primary" id="saveVisiteBtn">Planifier</button>
    </div>
  </div>
</div>

<script src="storage.js"></script>
<script src="calendrier.js"></script>
</body>
</html>
