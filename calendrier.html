<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pet Sitting — Calendrier</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EF878B">
<link rel="apple-touch-icon" href="logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="back-btn" id="backBtn"><i data-ic="arrow-left"></i></div>
    <h1><i data-ic="calendar"></i> Calendrier</h1>
  </div>

  <div class="cal-head">
    <div class="icon-btn" id="prevMonth">‹</div>
    <div class="month-label" id="monthLabel"></div>
    <div class="icon-btn" id="nextMonth">›</div>
  </div>

  <div id="calSiteBar" class="site-bar" style="display:none;">
    <select id="calSiteSelect" aria-label="Filtrer par site"></select>
  </div>

  <div class="cal-grid" id="calDow"></div>
  <div class="cal-grid mt-8" id="calGrid"></div>

  <div class="mt-16 small text-lt">
    <i data-ic="paw"></i> Garde &nbsp; <i data-ic="alarm"></i> Visite planifiée &nbsp; <i data-ic="key"></i> RDV clés — la couleur indique le chat
  </div>
  <div class="mt-8" id="animalLegend" style="display:flex; flex-wrap:wrap; gap:6px 12px;"></div>

  <div class="section mt-16">
    <div class="section-head"><h2 id="dayDetailTitle">Sélectionnez un jour</h2></div>
    <div id="dayDetail"></div>
  </div>

</div>

<!-- Modal : planifier une visite -->
<div class="modal-overlay" id="modalVisite">
  <div class="modal">
    <div class="modal-head">
      <h3>Planifier une visite</h3>
      <button class="modal-close" data-close="modalVisite"><i data-ic="x"></i></button>
    </div>
    <label>Animal</label>
    <select id="visiteAnimalSelect"></select>
    <label>Heure de la visite</label>
    <input type="time" id="visiteTime">
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close="modalVisite">Annuler</button>
      <button class="btn btn-primary" id="saveVisiteBtn">Planifier</button>
    </div>
  </div>
</div>

<!-- Modal : choisir la couleur d'un chat -->
<div class="modal-overlay" id="modalColorPicker">
  <div class="modal">
    <div class="modal-head">
      <h3 id="colorPickerTitle">Couleur du chat</h3>
      <button class="modal-close" data-close="modalColorPicker"><i data-ic="x"></i></button>
    </div>
    <div class="color-swatch-group" id="colorSwatchGroup"></div>
    <label class="mt-16">Ou choisis n'importe quelle couleur</label>
    <input type="color" id="customColorInput" style="width:100%; height:44px; border:none; border-radius:10px; cursor:pointer; padding:0;">
    <button class="btn btn-ghost btn-block mt-16" id="resetColorBtn"><i data-ic="refresh"></i> Couleur automatique</button>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close="modalColorPicker">Annuler</button>
      <button class="btn btn-primary" id="saveColorBtn">Enregistrer</button>
    </div>
  </div>
</div>

<script src="icons.js" defer></script>
<script src="footer.js" defer></script>
<script src="storage.js"></script>
<script type="module" src="cloudsync.js"></script>
<script type="module" src="calendrier.js"></script>
</body>
</html>
