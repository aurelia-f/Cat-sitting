<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Petsitting — Nouveau mot de passe</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EF878B">
<link rel="apple-touch-icon" href="logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app login-wrap">

  <div class="login-hero">
    <div class="paw"><i data-ic="paw"></i></div>
    <h1>Nouveau mot de passe</h1>
    <p>Choisis un nouveau mot de passe pour ton compte</p>
  </div>

  <div id="viewForm">
    <label>Nouveau mot de passe</label>
    <input type="password" id="newPasswordInput" placeholder="6 caractères minimum">
    <div class="field-hint" id="resetError" style="color:var(--red); display:none;"></div>
    <button class="btn btn-primary mt-16" id="confirmReset">Valider le nouveau mot de passe</button>
  </div>

  <div id="viewInvalid" style="display:none;">
    <div class="empty-state">
      Ce lien n'est plus valide ou a déjà été utilisé.<br>Demande un nouveau lien depuis l'écran de connexion.
    </div>
    <button class="btn btn-outline mt-16" id="backToLoginBtn">← Retour à la connexion</button>
  </div>

</div>

<script src="icons.js" defer></script>
<script src="footer.js" defer></script>
<script src="storage.js"></script>
<script type="module" src="reset-password.js"></script>
</body>
</html>
